<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes dos projetos de Enzo.">
  <title>Projeto — Enzo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <header class="header">
    <a class="logo" href="index.html">ENZO<span>.</span></a>
    <a class="project-back" href="index.html#projetos">← Voltar aos projetos</a>
  </header>
  <main class="project-detail-main">
    <a class="project-back" href="index.html#projetos">← Todos os projetos</a>
    <section class="project-detail-hero">
      <p class="eyebrow" id="projectCategory">PROJETO</p>
      <h1 id="projectTitle">Carregando<span>.</span></h1>
      <p class="project-detail-lead" id="projectLead"></p>
      <span class="project-status" id="projectStatus"></span>
      <div class="project-detail-tags" id="projectTags"></div>
    </section>
    <section class="project-detail-grid">
      <article class="project-detail-card">
        <h2>Visão geral</h2>
        <p id="projectOverview"></p>
      </article>
      <article class="project-detail-card">
        <h2>Objetivo</h2>
        <p id="projectObjective"></p>
      </article>
      <article class="project-detail-card">
        <h2>O que foi desenvolvido</h2>
        <ul id="projectFeatures"></ul>
      </article>
      <article class="project-detail-card">
        <h2>Tecnologias e aprendizados</h2>
        <p id="projectLearning"></p>
      </article>
    </section>
  </main>
  <footer class="footer">
    <span>© <span id="year"></span> Enzo. Feito com código e criatividade.</span>
    <a href="index.html#inicio">Voltar ao início ↑</a>
